scan:
  name: Scan library
  description: Rescan the Google Drive folder now and update the library. Returns the scan statistics.

dry_run:
  name: Dry run of the library rules
  description: >-
    Count how many files of the last scan each rule keeps or removes, with the current options or with the rules given here.
    Nothing is changed.
  fields:
    exclude_folders:
      name: Excluded folders
      description: Folder names; plain words match whole words ("temp" does not match "Temple").
      example: '["temp", "tmp"]'
      selector:
        object:
    exclude_files:
      name: Excluded file-name patterns
      description: Glob patterns such as "*_hide.*".
      example: '["*_hide.*"]'
      selector:
        object:
