scan:
  name: Scan library
  description: Rescan the Google Drive folder now and update the library. Returns the scan statistics.

sync:
  name: Sync now
  description: Build the slideshow folder now (the same job that runs daily). Returns the result.

dry_run:
  name: Dry run of the library rules
  description: >-
    Count how many files of the last scan each rule keeps or removes, with the current options or with the rules given here.
    Nothing is changed.
  fields:
    exclude_folders:
      name: Excluded folders
      description: Folder names; plain words match whole words ("temp" does not match "Temple").
      example: '["temp", "tmp"]'
      selector:
        object:
    exclude_files:
      name: Excluded file-name patterns
      description: Glob patterns such as "*_hide.*".
      example: '["*_hide.*"]'
      selector:
        object:

mark:
  name: Mark a photo or video
  description: Like, fix or never show an item of the slideshow (used by the buttons on the slideshow page).
  fields:
    mark:
      name: Mark
      description: like, fix or hide.
      required: true
      example: like
      selector:
        select:
          options: [like, fix, hide]
    id:
      name: Item ID
      description: The Drive file ID, as listed in the slideshow manifest.
      required: true
      selector:
        text:

send_report:
  name: Send the report now
  description: >-
    E-mail every mark collected since the last scheduled report (likes, fixes, never-show). The list is NOT cleared, so the next
    report is complete again; only the scheduled report at the report time clears it.
  fields:
    clear:
      name: Clear the list afterwards
      description: Start a new list after sending (normally only the scheduled report does this).
      default: false
      selector:
        boolean:
